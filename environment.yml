name: sae-rm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # PyTorch with CUDA 12.6 — change the index URL if your system uses a different CUDA version
    # CUDA 11.8: https://download.pytorch.org/whl/cu118
    # CUDA 12.1: https://download.pytorch.org/whl/cu121
    # CUDA 12.4: https://download.pytorch.org/whl/cu124
    - --extra-index-url https://download.pytorch.org/whl/cu126
    - torch==2.7.1+cu126
    - numpy==1.26.4
    - transformers==4.53.3
    - datasets==4.0.0
    - accelerate==1.9.0
    - sae-lens==6.6.4
    - wandb==0.21.1
    - openai==1.102.0
    - scipy==1.15.3
    - scikit-learn==1.7.1
    - pandas==2.3.1
    - matplotlib==3.10.3
    - seaborn==0.13.2
    - tqdm==4.67.1
    - huggingface-hub==0.34.0
    - einops==0.8.1
